name: macOS Release

# Triggers:
#   - Automatically when a GitHub Release is published (attaches DMGs to it)
#   - Manually via workflow_dispatch to attach DMGs to an existing release tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach DMGs to (e.g. v3.4.0)'
        required: true

permissions:
  contents: write  # required to upload release assets

jobs:
  build-macos:
    name: Build macOS DMGs
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install both SDKs: Core/Desktop/Web target net8.0, Api targets net9.0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run test suite (release gate)
        run: dotnet test FlipKit.sln --nologo --verbosity minimal

      - name: Publish Desktop, Web, and API (ARM64 + x64)
        run: |
          for ARCH in arm64 x64; do
            echo "--- Publishing for osx-$ARCH ---"

            dotnet publish FlipKit.Desktop \
              -c Release \
              -r osx-$ARCH \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -o publish/osx-$ARCH/desktop

            dotnet publish FlipKit.Web \
              -c Release \
              -r osx-$ARCH \
              --self-contained true \
              -o publish/osx-$ARCH/servers

            dotnet publish FlipKit.Api \
              -c Release \
              -r osx-$ARCH \
              --self-contained true \
              -o publish/osx-$ARCH/api-temp

            # Merge API output into the servers folder (same pattern as Windows/Linux builds)
            cp -Rn publish/osx-$ARCH/api-temp/. publish/osx-$ARCH/servers/
            rm -rf publish/osx-$ARCH/api-temp
          done

      - name: Assemble .app bundles
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          for ARCH in arm64 x64; do
            APP="publish/osx-$ARCH/FlipKit.app"

            # Standard macOS app bundle layout.
            # Servers go in Contents/MacOS/servers/ because AppContext.BaseDirectory
            # resolves to Contents/MacOS/ and ServerManagementService looks for
            # "servers/" relative to that path.
            mkdir -p "$APP/Contents/MacOS/servers"
            mkdir -p "$APP/Contents/Resources"

            # Move the Desktop single-file executable and make it executable
            mv "publish/osx-$ARCH/desktop/FlipKit.Desktop" "$APP/Contents/MacOS/FlipKit"
            chmod +x "$APP/Contents/MacOS/FlipKit"

            # Copy servers alongside the main binary
            cp -R "publish/osx-$ARCH/servers/." "$APP/Contents/MacOS/servers/"
            chmod +x "$APP/Contents/MacOS/servers/FlipKit.Web"  2>/dev/null || true
            chmod +x "$APP/Contents/MacOS/servers/FlipKit.Api"  2>/dev/null || true

            # Write Info.plist
            cat > "$APP/Contents/Info.plist" << PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleName</key>            <string>FlipKit</string>
  <key>CFBundleDisplayName</key>     <string>FlipKit</string>
  <key>CFBundleIdentifier</key>      <string>com.flipkit.desktop</string>
  <key>CFBundleVersion</key>         <string>${VERSION}</string>
  <key>CFBundleShortVersionString</key><string>${VERSION}</string>
  <key>CFBundleExecutable</key>      <string>FlipKit</string>
  <key>CFBundlePackageType</key>     <string>APPL</string>
  <key>NSHighResolutionCapable</key> <true/>
  <key>NSPrincipalClass</key>        <string>NSApplication</string>
  <key>LSMinimumSystemVersion</key>  <string>12.0</string>
  <key>NSCameraUsageDescription</key>
    <string>FlipKit uses your camera to capture card images for scanning.</string>
</dict>
</plist>
PLIST
          done

      - name: Create DMGs
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p releases

          for ARCH in arm64 x64; do
            LABEL=$([ "$ARCH" = "arm64" ] && echo "Apple-Silicon" || echo "Intel")
            DMG="releases/FlipKit-macOS-${LABEL}-v${VERSION}.dmg"

            # Stage: app bundle + Applications symlink + install notes
            STAGING=$(mktemp -d)
            cp -R "publish/osx-$ARCH/FlipKit.app" "$STAGING/"
            ln -s /Applications "$STAGING/Applications"
            cp installer/Mac/README-INSTALL.txt "$STAGING/" 2>/dev/null || true

            # hdiutil produces a read-only compressed DMG — no extra tools needed
            hdiutil create \
              -volname "FlipKit $VERSION" \
              -srcfolder "$STAGING" \
              -ov \
              -format UDZO \
              "$DMG"

            rm -rf "$STAGING"
            echo "Created: $DMG ($(du -sh "$DMG" | cut -f1))"
          done

      - name: Upload DMGs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release upload "$TAG" releases/FlipKit-macOS-*.dmg --clobber
          echo "Uploaded DMGs to release $TAG"
